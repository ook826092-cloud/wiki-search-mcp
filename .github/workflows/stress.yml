name: 极限测试
on:
  push:
  workflow_dispatch:

jobs:
  stress:
    name: 压力测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest jieba fastmcp
      - name: 极限测试（并发/海量/路径攻击/模糊查询）
        run: python -m pytest test_stress.py -v
