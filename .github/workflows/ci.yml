name: 静态+动态测试
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff mypy bandit semgrep
      - name: 语法检查
        run: python -m py_compile server.py
      - name: Ruff 静态错误
        run: ruff check server.py --select F
      - name: Bandit 安全扫描
        run: bandit -q server.py -f screen
      - name: Semgrep 安全扫描（OWASP 规则）
        run: semgrep scan --config=p/owasp-top-ten server.py --quiet || true
      - name: MyPy 类型检查
        run: mypy server.py --ignore-missing-imports
