name: 静态+动态测试
on:
  push:
  workflow_dispatch:

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff mypy bandit
      - name: 语法检查
        run: python -m py_compile server.py
      - name: Ruff 静态错误
        run: ruff check server.py --select F
      - name: Bandit 安全扫描
        run: bandit -q server.py -f screen
      - name: MyPy 类型检查
        run: mypy server.py --ignore-missing-imports

  test:
    name: 动态测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest jieba fastmcp pytest-cov hypothesis httpx
      - name: 单元+故障+属性测试（含覆盖率）
        run: python -m pytest test_server.py test_fault.py test_hypothesis.py -v --cov=server --cov-report=term-missing --cov-fail-under=40
      - name: MCP 协议级测试（真实 HTTP）
        run: python -m pytest test_mcp_protocol.py -v
