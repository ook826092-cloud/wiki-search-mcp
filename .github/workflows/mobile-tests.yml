name: 移动端极限测试
on:
  workflow_dispatch:

jobs:
  termux-env:
    name: Termux 环境（bionic 容器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 启动 Termux 容器
        run: |
          docker run --rm -d --name termux-test termux/termux-docker:latest sleep 300
      - name: 安装依赖（termux pkg）
        run: |
          docker exec -u termux termux-test sh -c "pkg update -y && pkg install -y python && pip install pytest jieba fastmcp"
      - name: 复制代码与测试
        run: |
          docker cp server.py termux-test:/data/data/com.termux/files/home/
          docker cp test_server.py test_fault.py test_regression.py test_hostile.py termux-test:/data/data/com.termux/files/home/
      - name: 回归+敌意极限测试（Termux bionic 环境）
        run: |
          docker exec -u termux termux-test sh -c "cd ~ && python -m pytest test_regression.py test_hostile.py -v"

  android-emulator:
    name: Android 模拟器（真机 Termux，x86_64 快）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            # 下载并安装 Termux（x86_64，动态解析 latest asset 不写死版本）
            URL=$(curl -s https://api.github.com/repos/termux/termux-app/releases/latest | grep -oE '"browser_download_url": *"[^"]*x86_64\.apk"' | head -1 | sed 's/.*"browser_download_url": *"//; s/"$//')
            echo "APK: $URL"
            curl -sL -o /tmp/termux.apk "$URL"
            adb install /tmp/termux.apk
            # 启动 Termux 初始化
            adb shell am start -n com.termux/.app.TermuxActivity
            sleep 10
            export TUX="PATH=/data/data/com.termux/files/usr/bin:$PATH HOME=/data/data/com.termux/files/home"
            # 装 python + 依赖
            adb shell "$TUX pkg update -y"
            adb shell "$TUX pkg install -y python"
            adb shell "$TUX pip install pytest jieba fastmcp"
            # 推代码
            adb push server.py test_server.py test_fault.py test_regression.py test_hostile.py /data/local/tmp/
            # 极限测试（真机 Termux bionic）
            adb shell "cd /data/local/tmp && $TUX python -m pytest test_regression.py test_hostile.py -v"

  android-emulator-arm:
    name: Android 模拟器（真机 Termux，ARM64 慢但真）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          script: |
            # 下载并安装 Termux（arm64-v8a，动态解析 latest asset）
            URL=$(curl -s https://api.github.com/repos/termux/termux-app/releases/latest | grep -oE '"browser_download_url": *"[^"]*arm64-v8a\.apk"' | head -1 | sed 's/.*"browser_download_url": *"//; s/"$//')
            echo "APK: $URL"
            curl -sL -o /tmp/termux.apk "$URL"
            adb install /tmp/termux.apk
            adb shell am start -n com.termux/.app.TermuxActivity
            sleep 10
            export TUX="PATH=/data/data/com.termux/files/usr/bin:$PATH HOME=/data/data/com.termux/files/home"
            adb shell "$TUX pkg update -y"
            adb shell "$TUX pkg install -y python"
            adb shell "$TUX pip install pytest jieba fastmcp"
            adb push server.py test_server.py test_fault.py test_regression.py test_hostile.py /data/local/tmp/
            adb shell "cd /data/local/tmp && $TUX python -m pytest test_regression.py test_hostile.py -v"
