name: mutation
on:
  workflow_dispatch:

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mutmut pytest jieba fastmcp hypothesis httpx
      - name: Run mutation testing
        run: mutmut run
      - name: Show results
        run: mutmut results
