name: 变异测试
on:
  workflow_dispatch:

jobs:
  mutate:
    name: 变异测试
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mutmut pytest jieba fastmcp hypothesis httpx
      - name: 运行变异测试
        run: |
          # 只保留基线已验证的轻测试（其余排除：百万页太重/起server/基线未验证）
          mv test_stress.py _stress_million.py
          mv test_mcp_protocol.py _protocol_excluded.py
          mv test_regression.py _regression_excluded.py
          mv test_hostile.py _hostile_excluded.py
          mutmut run
      - name: 显示结果
        run: mutmut results

  mutate-arm:
    name: 变异测试（ARM64）
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mutmut pytest jieba fastmcp hypothesis httpx
      - name: 运行变异测试
        run: |
          # 只保留基线已验证的轻测试（其余排除：百万页太重/起server/基线未验证）
          mv test_stress.py _stress_million.py
          mv test_mcp_protocol.py _protocol_excluded.py
          mv test_regression.py _regression_excluded.py
          mv test_hostile.py _hostile_excluded.py
          mutmut run
      - name: 显示结果
        run: mutmut results
