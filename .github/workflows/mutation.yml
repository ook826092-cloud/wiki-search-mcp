name: 变异测试
on:
  workflow_dispatch:

jobs:
  变异执行:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mutmut pytest jieba fastmcp hypothesis httpx
      - name: 运行变异测试
        run: mutmut run
      - name: 显示结果
        run: mutmut results
