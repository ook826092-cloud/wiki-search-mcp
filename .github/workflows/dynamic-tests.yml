name: dynamic-tests
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pytest jieba fastmcp
      - name: Run dynamic tests (unit + integration)
        run: python -m pytest test_server.py -v
