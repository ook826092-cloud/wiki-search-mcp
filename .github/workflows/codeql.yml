name: 安全分析（CodeQL）
on:
  push:
  workflow_dispatch:

jobs:
  分析:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
