name: static-checks
on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checkers
        run: pip install ruff mypy bandit
      - name: Syntax check
        run: python -m py_compile server.py
      - name: Ruff check (F errors only, strict)
        run: |
          ruff --version
          ruff check server.py --select F
      - name: Bandit security scan
        run: bandit -q server.py -f screen
      - name: MyPy type check
        run: mypy server.py --ignore-missing-imports
